[project]
name = "custom_ppc"
authors = [{ name = "Apnemy Technologies", email = "ap@apnemy.com" }]
description = "Package-wise UOM handling (any UOM to any UOM) and production planning & control for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
